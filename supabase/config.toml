project_id = "mm-etiquetas"

[api]
enabled = true
port = 54321
schemas = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

# shopify-webhook verifies the Shopify HMAC signature and reconciliation-cron
# checks CRON_SECRET (set via pg_cron, see supabase/migrations/0002_pg_cron.sql)
# — neither is a browser session, so both disable Supabase's own JWT check.
# panel just serves static files, no auth needed there either. orders-api is
# the one function real users hit, so it uses actual Supabase Auth (email +
# password) instead of a shared token — see getAuthenticatedUser in auth.ts.
[functions.shopify-webhook]
verify_jwt = false

# Was `true` until 2026-09-10. The gateway's built-in verify_jwt only
# understands the legacy symmetric (HS256) JWT secret -- once the project
# rotated to asymmetric JWT Signing Keys (ECC/P-256, done ~2026-08-18), every
# freshly issued or refreshed session token got rejected at the gateway with
# `{"code":401,"message":"Invalid JWT"}` / UNAUTHORIZED_ASYMMETRIC_JWT before
# this function's own code ever ran -- effectively locking every real user
# out of the whole panel. Per Supabase's own guidance for asymmetric-key
# projects, auth now happens in code instead: getAuthenticatedUser calls
# supabase.auth.getUser(token), which validates against the Auth API and
# works regardless of which key type signed the token.
[functions.orders-api]
verify_jwt = false

[functions.panel]
verify_jwt = false

[functions.reconciliation-cron]
verify_jwt = false

# external-order-intake é chamada sistema-a-sistema pelo mental-madness-
# vendas-externas, autenticada por EXTERNAL_ORDERS_SECRET — mesmo padrão do
# shopify-webhook.
[functions.external-order-intake]
verify_jwt = false
